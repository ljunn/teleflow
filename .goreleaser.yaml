version: 2

project_name: teleflow

before:
  hooks:
    - go mod tidy

builds:
  - id: teleflow
    main: ./cmd/teleflow
    binary: teleflow
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/teleflow/teleflow/internal/version.Version={{ .Version }}
      - -X github.com/teleflow/teleflow/internal/version.Commit={{ .Commit }}
      - -X github.com/teleflow/teleflow/internal/version.BuildDate={{ .Date }}

archives:
  - id: teleflow
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - src: deploy/teleflow.service
        dst: .
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
